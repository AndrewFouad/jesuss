<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="2"/>

  <!-- Halo Ring -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6,6" opacity="0.4"/>
  <circle cx="256" cy="230" r="110" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.3"/>

  <!-- Holy Cross Motif -->
  <!-- Vertical Beam -->
  <rect x="238" y="110" width="36" height="270" rx="12" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
  <!-- Horizontal Beam -->
  <rect x="156" y="190" width="200" height="36" rx="12" fill="url(#goldGrad)" filter="url(#goldGlow)"/>

  <!-- Radiant Light rays -->
  <circle cx="256" cy="208" r="18" fill="#FEF08A"/>
</svg>
